# Real-world Bun single-file executables, read by pao and never run.
# tools/corpus/fetch.py downloads them into tools/corpus/out/<name>/.
#
# Each [[asset]] pins one GitHub release asset:
#   name    directory under out/, unique
#   repo    owner/repository on GitHub
#   tag     release tag; changing it is how the corpus is refreshed
#   asset   file name in that release
#   sha256  digest of the asset; leave it out to have fetch.py print it
#   why     what this binary covers that the fixture builds do not
#
# Every pinned sha256 was checked against the digest GitHub records for the
# asset, and against the project's own checksum file where it publishes one
# (terminaltype, botmux, capa).

[[asset]]
name = "terminaltype-darwin-arm64"
repo = "daisfasl/terminaltype"
tag = "v0.1.0"
asset = "terminaltype-darwin-arm64"
sha256 = "4066240c8409baa566070d56f87c55425eac8bebb0d7956967215e27d5ae0ab1"
why = "the only release found that embeds a database as sqlite_embedded"

